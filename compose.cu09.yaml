# Additive application integration; never publishes PostgreSQL or embeds credentials.
services:
  backend:
    environment:
      DATABASE_URL: ${CU09_DATABASE_URL:?Supply a PostgreSQL application URL in the process environment}
      APP_ORIGINS: ${CU09_APP_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      SESSION_COOKIE_SECURE: ${CU09_COOKIE_SECURE:-false}
