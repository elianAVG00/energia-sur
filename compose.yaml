services:
  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      args:
        VITE_ASSISTANT_TTL_MINUTES: ${ASSISTANT_VISITOR_TTL_MINUTES:-30}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    platform: linux/amd64
    environment:
      CU06_CONFIRMATION_SECRET: ${CU06_CONFIRMATION_SECRET:-}
      OUTAGE_SCHEDULER_ENABLED: ${OUTAGE_SCHEDULER_ENABLED:-true}
      OUTAGE_REFRESH_SECONDS: ${OUTAGE_REFRESH_SECONDS:-300}
      SCHEDULED_WORKS_SCHEDULER_ENABLED: ${SCHEDULED_WORKS_SCHEDULER_ENABLED:-true}
      SCHEDULED_WORKS_REFRESH_SECONDS: ${SCHEDULED_WORKS_REFRESH_SECONDS:-300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ASSISTANT_GUIDE_INGEST: ${ASSISTANT_GUIDE_INGEST:-false}
      ASSISTANT_GUIDE_MAX_AGE_DAYS: ${ASSISTANT_GUIDE_MAX_AGE_DAYS:-90}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-10}
      ASSISTANT_RATE_WINDOW_SECONDS: ${ASSISTANT_RATE_WINDOW_SECONDS:-60}
      ASSISTANT_MESSAGE_MAX_CHARS: ${ASSISTANT_MESSAGE_MAX_CHARS:-2000}
      ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-30}
      ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-600}
      ASSISTANT_TOP_K: ${ASSISTANT_TOP_K:-4}
      ASSISTANT_MAX_DISTANCE: ${ASSISTANT_MAX_DISTANCE:-0.85}
      ASSISTANT_MAX_BODY_BYTES: ${ASSISTANT_MAX_BODY_BYTES:-16384}
      ASSISTANT_FIRST_BYTE_TIMEOUT: ${ASSISTANT_FIRST_BYTE_TIMEOUT:-10}
      ASSISTANT_MAX_CONCURRENCY: ${ASSISTANT_MAX_CONCURRENCY:-4}
      ASSISTANT_HISTORY_MAX_MESSAGES: ${ASSISTANT_HISTORY_MAX_MESSAGES:-10}
      ASSISTANT_HISTORY_MAX_CHARS: ${ASSISTANT_HISTORY_MAX_CHARS:-4000}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-30}
    mem_limit: 1g
    memswap_limit: 1g
    ulimits:
      core:
        soft: 0
        hard: 0
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - cu05_photos:/var/lib/energia-sur/photos
      - cu06_bills:/var/lib/energia-sur/bills
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  db:
    platform: linux/amd64
    image: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energia_sur}
      POSTGRES_USER: ${POSTGRES_USER:-energia_sur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or local .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  cu05_photos:
  cu06_bills:
