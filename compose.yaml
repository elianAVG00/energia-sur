services:
  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    platform: linux/amd64
    environment:
      CU06_CONFIRMATION_SECRET: ${CU06_CONFIRMATION_SECRET:-}
      OUTAGE_SCHEDULER_ENABLED: ${OUTAGE_SCHEDULER_ENABLED:-true}
      OUTAGE_REFRESH_SECONDS: ${OUTAGE_REFRESH_SECONDS:-300}
    mem_limit: 1g
    memswap_limit: 1g
    ulimits:
      core:
        soft: 0
        hard: 0
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - cu05_photos:/var/lib/energia-sur/photos
      - cu06_bills:/var/lib/energia-sur/bills
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  db:
    platform: linux/amd64
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energia_sur}
      POSTGRES_USER: ${POSTGRES_USER:-energia_sur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or local .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  cu05_photos:
  cu06_bills:
